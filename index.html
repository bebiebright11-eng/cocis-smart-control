<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoCIS Building Walkthrough</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout concept: one technical floor-plan sheet that you operate. Ink lines on a pale drawing ground; red is reserved for beams, amber for doors, teal for RFID. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --panel2: #e3e9ef;
  --ink: #15202b;
  --muted: #566677;
  --line: #c3cdd8;
  --wall: #c9d2dc;
  --beam: #d1302a;
  --door: #b86d12;
  --rfid: #0c7f81;
  --ok: #1f7a49;
  --warn: #e0a800;
  --accent: #1b4f8a;
  --lit: #fff3c4;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --panel: #16202a; --panel2: #1d2935; --ink: #e5ecf3; --muted: #92a2b2;
    --line: #2b3946; --wall: #263340; --beam: #ff6b61; --door: #e6a24d; --rfid: #42c4c6;
    --ok: #52c288; --warn: #f2c94c; --accent: #77adec; --lit: #4a4220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --panel: #16202a; --panel2: #1d2935; --ink: #e5ecf3; --muted: #92a2b2;
  --line: #2b3946; --wall: #263340; --beam: #ff6b61; --door: #e6a24d; --rfid: #42c4c6;
  --ok: #52c288; --warn: #f2c94c; --accent: #77adec; --lit: #4a4220; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
}
main { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--font-head); font-weight: 600; letter-spacing: .01em; font-size: clamp(28px, 4vw, 38px); line-height: 1.05; margin: 0; text-wrap: balance; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 2px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; overflow-x: auto; }
svg { display: block; width: 100%; min-width: 680px; height: auto; max-height: max(380px, calc(100vh - 290px)); color: var(--ink); margin: 0 auto; }

/* svg parts */
.bldg { fill: var(--panel); stroke: var(--ink); stroke-width: 3; }
.wall { fill: var(--wall); }
.chan { fill: var(--bg); }
.room { fill: var(--panel2); stroke: var(--ink); stroke-width: 2.5; transition: fill .4s; }
.room.lit { fill: var(--lit); }
.cell { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
.door { fill: var(--door); transform-box: fill-box; transform-origin: 50% 0%; transition: transform .5s ease; }
.door.open { transform: scaleY(.16); }
.beam { stroke: var(--beam); stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
.beam.cut { stroke-width: 7; stroke-dasharray: none; }
.beamdev { fill: var(--beam); }
.rfid { fill: var(--rfid); stroke: transparent; stroke-width: 3; }
.rfid.on { stroke: var(--ink); }
.flow { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.arrowfill { fill: var(--muted); }
.t { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); }
.t-beam { fill: var(--beam); }
.t-door { fill: var(--door); }
.t-rfid { fill: var(--rfid); }
.t-zone { font-family: var(--font-head); font-weight: 600; font-size: 20px; letter-spacing: .06em; fill: var(--muted); }
.t-letter { font-family: var(--font-head); font-weight: 600; font-size: 28px; fill: var(--beam); }
.t-num { font-family: var(--font-head); font-weight: 600; font-size: 46px; fill: var(--ink); }
.t-count { font-family: var(--font-mono); font-size: 13px; fill: var(--ink); }
.bulb { fill: var(--line); stroke: var(--muted); stroke-width: 2; transition: fill .3s; }
.bulb.on { fill: var(--warn); stroke: var(--door); }
.counter { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }

.person { transition: transform var(--mv, .6s) ease-in-out, opacity .3s; opacity: 0; }
.person circle { fill: var(--ink); }
.person text { font-family: var(--font-mono); font-size: 9px; font-weight: 500; fill: var(--panel); text-anchor: middle; }
.person.ghost circle { fill: var(--muted); stroke: var(--beam); stroke-width: 2; stroke-dasharray: 3 2; }

.cardp { opacity: 0; transition: opacity .25s; }
.cardp.show { opacity: 1; }
.cardp rect { fill: var(--panel); stroke: var(--ok); stroke-width: 2; }
.cardp .cn { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; fill: var(--ink); }
.cardp .cs { font-family: var(--font-mono); font-size: 10px; font-weight: 500; fill: var(--ok); }

.alarmg { opacity: 0; transition: opacity .2s; }
.alarmg.show { opacity: 1; animation: flash 0.7s steps(2, jump-none) infinite; }
.alarmg rect { fill: var(--beam); }
.alarmg .a1 { font-family: var(--font-head); font-weight: 600; font-size: 24px; fill: #fff; letter-spacing: .08em; }
.alarmg .a2 { font-family: var(--font-mono); font-size: 11px; fill: #fff; }
@keyframes flash { 0% { filter: none; } 100% { filter: brightness(.78); } }

/* controls */
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; }
.bar-r { width: auto; }
.bar-r .glabel { width: 100%; text-align: right; }
.grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.glabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 100%; }
.btn {
  font: 600 14px var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 12px; cursor: pointer; min-height: 38px;
}
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
.btn.alarm { border-color: var(--beam); color: var(--beam); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.say { background: var(--panel2); border-radius: 8px; padding: 10px 14px; min-height: 76px; }
.say strong { display: block; font-family: var(--font-head); font-size: 22px; font-weight: 600; margin-bottom: 1px; }
.say span { color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .door, .person, .room, .bulb, .cardp, .alarmg { transition: none; }
  .alarmg.show { animation: none; }
}
</style>

<main>
  <header class="head">
    <div>
      <p class="kicker">CoCIS Smart Control and Monitoring System</p>
      <h1>How the building works</h1>
    </div>
    <div class="grp bar-r">
      <span class="glabel">Speed</span>
      <button class="btn" data-keep id="sp-n" aria-pressed="true">Normal</button>
      <button class="btn" data-keep id="sp-s" aria-pressed="false">Slow</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </header>

  <div class="bar">
    <div class="grp"><span class="glabel">Entrance</span>
      <button class="btn primary" id="e-one">Tap card to enter</button>
      <button class="btn alarm" id="e-two">Two people, one card</button>
    </div>
    <div class="grp"><span class="glabel">Exit</span>
      <button class="btn primary" id="x-one">Tap card to leave</button>
      <button class="btn alarm" id="x-two">Two people, one card</button>
    </div>
    <div class="grp"><span class="glabel">Lecture room 1</span>
      <button class="btn primary" id="r1-in">Walk in</button>
      <button class="btn" id="r1-out">Walk out</button>
    </div>
    <div class="grp"><span class="glabel">Lecture room 2</span>
      <button class="btn primary" id="r2-in">Walk in</button>
      <button class="btn" id="r2-out">Walk out</button>
    </div>
  </div>

  <div class="sheet">
    <svg id="plan" viewBox="0 0 1000 560" role="img" aria-label="Interactive floor plan of the building: entrance, exit and two lecture rooms with beams, doors, card readers and lights.">
      <defs>
        <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowfill" d="M0 0L10 5L0 10z"/></marker>
      </defs>

      <text class="t-zone" x="75" y="46" text-anchor="middle">OUTSIDE</text>
      <rect class="bldg" x="150" y="20" width="830" height="520"/>
      <text class="t-zone" x="445" y="48">INSIDE</text>

      <!-- gatehouse with two tunnels -->
      <rect class="wall" x="150" y="70" width="280" height="260"/>
      <rect class="chan" x="146" y="90" width="288" height="70"/>
      <rect class="chan" x="146" y="240" width="288" height="70"/>
      <text class="t" x="290" y="205" text-anchor="middle">one person at a time</text>

      <!-- entrance lane -->
      <rect class="door" id="doorE1" x="168" y="92" width="8" height="66"/>
      <rect class="door" id="doorE2" x="404" y="92" width="8" height="66"/>
      <line class="beam" id="bE" x1="290" y1="90" x2="290" y2="160"/>
      <rect class="beamdev" x="285" y="86" width="10" height="6"/>
      <rect class="beamdev" x="285" y="158" width="10" height="6"/>
      <text class="t t-door" x="182" y="112">E1</text>
      <text class="t t-door" x="400" y="112" text-anchor="end">E2</text>
      <text class="t t-beam" x="290" y="80" text-anchor="middle">beam</text>
      <text class="t-zone" x="75" y="108" text-anchor="middle" style="font-size:17px">ENTRANCE</text>
      <line class="flow" x1="20" y1="125" x2="140" y2="125" marker-end="url(#arr1)"/>

      <!-- exit lane -->
      <rect class="door" id="doorX2" x="168" y="242" width="8" height="66"/>
      <rect class="door" id="doorX1" x="404" y="242" width="8" height="66"/>
      <line class="beam" id="bX" x1="290" y1="240" x2="290" y2="310"/>
      <rect class="beamdev" x="285" y="236" width="10" height="6"/>
      <rect class="beamdev" x="285" y="308" width="10" height="6"/>
      <text class="t t-door" x="182" y="262">X2</text>
      <text class="t t-door" x="400" y="262" text-anchor="end">X1</text>
      <text class="t t-beam" x="290" y="330" text-anchor="middle">beam</text>
      <text class="t-zone" x="75" y="258" text-anchor="middle" style="font-size:17px">EXIT</text>
      <line class="flow" x1="140" y1="275" x2="20" y2="275" marker-end="url(#arr1)"/>

      <!-- RFID readers -->
      <rect class="rfid" id="rdE" x="100" y="172" width="44" height="24"/>
      <text class="t t-rfid" x="94" y="188" text-anchor="end">ENTRY reader</text>
      <rect class="rfid" id="rdX" x="440" y="205" width="44" height="24"/>
      <text class="t t-rfid" x="440" y="248">EXIT reader</text>

      <!-- flows inside -->
      <path class="flow" d="M432 125 H556 V150 H590" marker-end="url(#arr1)"/>
      <path class="flow" d="M556 150 V420 H590" marker-end="url(#arr1)"/>
      <path class="flow" d="M520 275 H436" marker-end="url(#arr1)"/>
      <text class="t" x="458" y="306">lobby</text>

      <!-- counter -->
      <rect class="counter" x="440" y="436" width="108" height="94" rx="6"/>
      <text class="t" x="494" y="458" text-anchor="middle" style="font-size:10px">IN THE BUILDING</text>
      <text class="t-num" id="cnt" x="494" y="508" text-anchor="middle">0</text>

      <!-- Room 1 -->
      <rect class="room" id="room1" x="660" y="40" width="300" height="220"/>
      <text class="t-zone" x="680" y="70" style="font-size:18px">LECTURE ROOM 1</text>
      <text class="t-count" id="rc1" x="944" y="70" text-anchor="end">0 inside</text>
      <rect class="cell" x="596" y="130" width="64" height="40"/>
      <rect x="656" y="132" width="8" height="36" style="fill:var(--panel2)"/>
      <line class="beam" id="bA1" x1="614" y1="130" x2="614" y2="170"/>
      <line class="beam" id="bB1" x1="642" y1="130" x2="642" y2="170"/>
      <text class="t-letter" x="614" y="122" text-anchor="middle">A</text>
      <text class="t-letter" x="642" y="122" text-anchor="middle">B</text>
      <text class="t" x="656" y="188" text-anchor="end" style="font-size:11px">A out · B in</text>
      <circle class="bulb" id="bulb1" cx="810" cy="130" r="22"/>
      <text class="t" id="bl1" x="810" y="176" text-anchor="middle">light off</text>

      <!-- Room 2 -->
      <rect class="room" id="room2" x="660" y="310" width="300" height="220"/>
      <text class="t-zone" x="680" y="340" style="font-size:18px">LECTURE ROOM 2</text>
      <text class="t-count" id="rc2" x="944" y="340" text-anchor="end">0 inside</text>
      <rect class="cell" x="596" y="400" width="64" height="40"/>
      <rect x="656" y="402" width="8" height="36" style="fill:var(--panel2)"/>
      <line class="beam" id="bA2" x1="614" y1="400" x2="614" y2="440"/>
      <line class="beam" id="bB2" x1="642" y1="400" x2="642" y2="440"/>
      <text class="t-letter" x="614" y="392" text-anchor="middle">A</text>
      <text class="t-letter" x="642" y="392" text-anchor="middle">B</text>
      <text class="t" x="656" y="458" text-anchor="end" style="font-size:11px">A out · B in</text>
      <circle class="bulb" id="bulb2" cx="810" cy="400" r="22"/>
      <text class="t" id="bl2" x="810" y="446" text-anchor="middle">light off</text>

      <!-- legend -->
      <line class="beam" x1="12" y1="452" x2="40" y2="452"/>
      <text class="t" x="48" y="456">beam</text>
      <rect class="door" x="12" y="474" width="28" height="8"/>
      <text class="t" x="48" y="483">door</text>
      <rect class="rfid" x="12" y="500" width="28" height="14"/>
      <text class="t" x="48" y="511">RFID reader</text>

      <!-- people -->
      <g id="people"></g>

      <!-- card read-outs -->
      <g class="cardp" id="cardE">
        <rect x="8" y="206" width="136" height="38" rx="4"/>
        <text class="cn" id="cE-n" x="14" y="222"></text>
        <text class="cs" id="cE-s" x="14" y="237"></text>
      </g>
      <g class="cardp" id="cardX">
        <rect x="434" y="160" width="112" height="38" rx="4"/>
        <text class="cn" id="cX-n" x="440" y="176"></text>
        <text class="cs" id="cX-s" x="440" y="191"></text>
      </g>

      <!-- alarm -->
      <g class="alarmg" id="alarm">
        <rect x="160" y="450" width="262" height="72" rx="6"/>
        <text class="a1" x="291" y="478" text-anchor="middle">ALARM</text>
        <text class="a2" x="291" y="498" text-anchor="middle">beam cut twice: two people</text>
        <text class="a2" id="alarm2" x="291" y="513" text-anchor="middle">door E2 stays shut</text>
      </g>
    </svg>
  </div>

  <div class="say" aria-live="polite"><strong id="s-title">Press a button</strong><span id="s-text">Tap a card at the entrance to let someone in, then send people into the lecture rooms. Use "Two people, one card" to show the alarm.</span></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var NAMES = [
    { name: 'Mugume Brighton', tag: 'MB' },
    { name: 'Gift', tag: 'G' },
    { name: 'Matthias', tag: 'Ma' },
    { name: 'Swabahat', tag: 'S' },
    { name: 'Precious', tag: 'P' }
  ];
  var slow = false, busy = false, tick = 0;
  function MV() { return slow ? 1000 : 600; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function wait(ms) { return sleep(slow ? ms * 1.6 : ms); }

  /* ---------- people ---------- */
  var layer = $('people');
  function mk(tag, cls) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'person' + (cls ? ' ' + cls : ''));
    var c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 11);
    var t = document.createElementNS(NS, 'text'); t.setAttribute('y', 3.5); t.textContent = tag;
    g.appendChild(c); g.appendChild(t); layer.appendChild(g);
    return g;
  }
  function put(el, x, y, instant) {
    if (instant) {
      el.style.transition = 'none';
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      el.getBoundingClientRect();
      el.style.transition = '';
    } else {
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
  }
  function show(el, on) { el.style.opacity = on ? 1 : 0; }
  function mv(el, x, y) { put(el, x, y); return sleep(MV() + 80); }

  var people = NAMES.map(function (n) {
    var p = { name: n.name, loc: 'out', t: 0, el: mk(n.tag) };
    put(p.el, 30, 125, true);
    return p;
  });
  var ghost = { el: mk('?', 'ghost') };
  put(ghost.el, 30, 125, true);

  function inLoc(loc) {
    return people.filter(function (p) { return p.loc === loc; }).sort(function (a, b) { return a.t - b.t; });
  }
  function slotLobby(k) { return [458 + (k % 4) * 24, 324 + Math.floor(k / 4) * 26]; }
  function slotRoom(r, k) { return [690 + k * 26, r === 1 ? 225 : 495]; }
  function layout() {
    inLoc('lobby').forEach(function (p, k) { var s = slotLobby(k); put(p.el, s[0], s[1]); show(p.el, 1); });
    [1, 2].forEach(function (r) {
      inLoc('r' + r).forEach(function (p, k) { var s = slotRoom(r, k); put(p.el, s[0], s[1]); show(p.el, 1); });
    });
  }

  /* ---------- parts ---------- */
  function door(id, open) { $(id).classList.toggle('open', open); }
  function beam(id, on) { $(id).classList.toggle('cut', on); }
  function say(t, d) { $('s-title').textContent = t; $('s-text').textContent = d; }
  function card(w, name, status, on) {
    $('c' + w + '-n').textContent = name;
    $('c' + w + '-s').textContent = status;
    $('card' + w).classList.toggle('show', on);
  }
  function alarm(on, line2) {
    if (line2) { $('alarm2').textContent = line2; }
    $('alarm').classList.toggle('show', on);
  }
  function refresh() {
    var b = people.filter(function (p) { return p.loc !== 'out'; }).length;
    $('cnt').textContent = b;
    [1, 2].forEach(function (r) {
      var n = inLoc('r' + r).length;
      $('rc' + r).textContent = n + ' inside';
      $('bulb' + r).classList.toggle('on', n > 0);
      $('room' + r).classList.toggle('lit', n > 0);
      $('bl' + r).textContent = n > 0 ? 'light ON' : 'light off';
    });
    return b;
  }
  function lock(on) {
    busy = on;
    document.querySelectorAll('.bar button').forEach(function (b) {
      if (!b.hasAttribute('data-keep')) { b.disabled = on; }
    });
  }

  /* ---------- entrance ---------- */
  async function entry(twice) {
    var p = people.filter(function (x) { return x.loc === 'out'; })[0];
    if (!p) {
      say('Everyone is already inside', 'All five people in this demo are in the building. Use the exit to let someone out first.');
      return;
    }
    lock(true);
    put(p.el, 30, 125, true); show(p.el, 1);
    await mv(p.el, 122, 125);
    $('rdE').classList.add('on');
    card('E', p.name.toUpperCase(), 'ACCESS GRANTED', true);
    say('Card read: ' + p.name, 'Access granted. The reader identified the card, and the system checked the person and the opening hours.');
    await wait(1500);

    door('doorE1', true);
    say('Door E1 opens', 'The outside door opens. One person may step into the tunnel.');
    await wait(700);

    if (twice) {
      put(ghost.el, 60, 125, true); show(ghost.el, 1);
      say('Two people go in', 'Only one card was tapped. The second person walks right behind.');
      put(p.el, 200, 125); put(ghost.el, 164, 125);
      await sleep(MV() + 80);
      put(p.el, 290, 125); put(ghost.el, 254, 125);
      await sleep(MV() + 80);
      beam('bE', true);
      say('Beam cut', 'The first person cuts the beam.');
      await wait(900);
      await mv(ghost.el, 290, 125);
      beam('bE', false); await sleep(180); beam('bE', true);
      alarm(true, 'door E2 stays shut');
      say('Beam cut twice: ALARM', 'A second cut means two people. Door E2 stays shut and nobody is counted.');
      await wait(2800);
      beam('bE', false);
      put(p.el, 122, 125); put(ghost.el, 96, 125);
      await sleep(MV() + 80);
      door('doorE1', false);
      put(p.el, 30, 125); put(ghost.el, 20, 125);
      await sleep(MV() + 80);
      show(p.el, 0); show(ghost.el, 0);
      alarm(false);
      say('Nobody was counted', 'Door E2 never opened. The building count did not change.');
    } else {
      await mv(p.el, 200, 125);
      await mv(p.el, 290, 125);
      beam('bE', true);
      say('Beam cut once', 'The beam inside the tunnel saw one person. The system makes sure there is no second person.');
      await wait(1500);
      beam('bE', false);
      p.loc = 'lobby'; p.t = ++tick;
      var n = refresh();
      say('Counted: one person entered', p.name + ' is counted. The building now holds ' + n + ' ' + (n === 1 ? 'person' : 'people') + '.');
      door('doorE1', false);
      await wait(600);
      door('doorE2', true);
      say('Door E2 opens', 'The inside door opens and the person walks into the building.');
      await mv(p.el, 360, 125);
      await mv(p.el, 440, 125);
      door('doorE2', false);
      await mv(p.el, 500, 125);
      await mv(p.el, 500, 300);
      layout();
      await sleep(MV());
    }
    card('E', '', '', false);
    $('rdE').classList.remove('on');
    lock(false);
  }

  /* ---------- exit ---------- */
  async function exit_(twice) {
    var lobby = inLoc('lobby');
    var b = people.filter(function (p) { return p.loc !== 'out'; }).length;
    if (lobby.length === 0) {
      say(b === 0 ? 'Nobody is inside' : 'Nobody is in the lobby',
          b === 0 ? 'Let someone in through the entrance first.' : 'Everyone inside is in a lecture room. They must walk out of the room first.');
      return;
    }
    if (twice && lobby.length < 2) {
      say('Two people are needed', 'Let a second person into the lobby first, then try again.');
      return;
    }
    var p = lobby[0], q = twice ? lobby[1] : null;
    lock(true);
    put(p.el, 500, 262);
    if (q) { put(q.el, 536, 262); }
    await sleep(MV() + 80);
    put(p.el, 462, 262);
    if (q) { put(q.el, 498, 262); }
    await sleep(MV() + 80);
    $('rdX').classList.add('on');
    card('X', p.name.toUpperCase(), 'ACCESS GRANTED', true);
    say('Card read: ' + p.name, 'Access granted. The exit reader identified the card.');
    await wait(1500);

    door('doorX1', true);
    say('Door X1 opens', 'The inside door of the exit opens. One person may step into the tunnel.');
    await wait(700);
    layout();
    put(p.el, 360, 275); if (q) { put(q.el, 396, 275); }
    await sleep(MV() + 80);
    put(p.el, 290, 275); if (q) { put(q.el, 326, 275); }
    await sleep(MV() + 80);
    beam('bX', true);

    if (twice) {
      say('Beam cut', 'The first person cuts the beam.');
      await wait(900);
      await mv(q.el, 290, 275);
      beam('bX', false); await sleep(180); beam('bX', true);
      alarm(true, 'door X2 stays shut');
      say('Beam cut twice: ALARM', 'A second cut means two people. Door X2 stays shut and nobody is counted out.');
      await wait(2800);
      beam('bX', false);
      put(p.el, 440, 275); put(q.el, 476, 275);
      await sleep(MV() + 80);
      door('doorX1', false);
      alarm(false);
      layout();
      await sleep(MV());
      say('Nobody was counted out', 'Door X2 never opened. Both people are still in the building.');
    } else {
      say('Beam cut once', 'The beam inside the tunnel saw one person. The system makes sure there is no second person.');
      await wait(1500);
      beam('bX', false);
      p.loc = 'out';
      var n = refresh();
      say('Counted: one person left', p.name + ' is counted out. The building now holds ' + n + ' ' + (n === 1 ? 'person' : 'people') + '.');
      door('doorX1', false);
      await wait(600);
      door('doorX2', true);
      say('Door X2 opens', 'The outside door opens and the person walks out.');
      await mv(p.el, 200, 275);
      await mv(p.el, 120, 275);
      door('doorX2', false);
      await mv(p.el, 40, 275);
      show(p.el, 0);
      layout();
    }
    card('X', '', '', false);
    $('rdX').classList.remove('on');
    lock(false);
  }

  /* ---------- lecture rooms ---------- */
  var CY = { 1: 150, 2: 420 };
  async function roomIn(r) {
    var lobby = inLoc('lobby');
    var b = people.filter(function (p) { return p.loc !== 'out'; }).length;
    if (lobby.length === 0) {
      say(b === 0 ? 'Nobody is in the building' : 'Nobody is waiting in the lobby',
          b === 0 ? 'Let someone in through the entrance first.' : 'Everyone inside is already in a lecture room.');
      return;
    }
    lock(true);
    var p = lobby[0], cy = CY[r], A = 'bA' + r, B = 'bB' + r;
    say('Walking to Room ' + r, p.name + ' goes to the lecture room door.');
    await mv(p.el, 556, 330);
    await mv(p.el, 556, cy);
    await mv(p.el, 596, cy);
    await mv(p.el, 614, cy);
    beam(A, true);
    say('Beam A is cut first', 'A is the outside beam.');
    await wait(900);
    await mv(p.el, 642, cy);
    beam(A, false); beam(B, true);
    say('Then beam B is cut', 'A then B means someone is ENTERING.');
    await wait(900);
    beam(B, false);
    p.loc = 'r' + r; p.t = ++tick;
    refresh();
    var n = inLoc('r' + r).length;
    say('Room ' + r + ' count: ' + n, 'There ' + (n === 1 ? 'is 1 person' : 'are ' + n + ' people') + ' inside, so the light is on.');
    layout();
    await sleep(MV() + 100);
    lock(false);
  }
  async function roomOut(r) {
    var list = inLoc('r' + r);
    if (list.length === 0) {
      say('Room ' + r + ' is empty', 'Nobody is inside, and the light is already off.');
      return;
    }
    lock(true);
    var p = list[list.length - 1], cy = CY[r], A = 'bA' + r, B = 'bB' + r;
    say('Leaving Room ' + r, p.name + ' walks to the door from the inside.');
    await mv(p.el, 690, cy);
    await mv(p.el, 642, cy);
    beam(B, true);
    say('Beam B is cut first', 'B is the inside beam.');
    await wait(900);
    await mv(p.el, 614, cy);
    beam(B, false); beam(A, true);
    say('Then beam A is cut', 'B then A means someone is LEAVING.');
    await wait(900);
    beam(A, false);
    p.loc = 'lobby'; p.t = ++tick;
    refresh();
    var n = inLoc('r' + r).length;
    say('Room ' + r + ' count: ' + n, n === 0 ? 'The room is empty, so the light switches off by itself.' : 'There ' + (n === 1 ? 'is still 1 person' : 'are still ' + n + ' people') + ' inside, so the light stays on.');
    await mv(p.el, 556, cy);
    await mv(p.el, 556, 330);
    layout();
    await sleep(MV() + 100);
    lock(false);
  }

  /* ---------- reset and speed ---------- */
  function reset() {
    if (busy) { return; }
    people.forEach(function (p) { p.loc = 'out'; p.t = 0; show(p.el, 0); put(p.el, 30, 125, true); });
    show(ghost.el, 0);
    ['doorE1', 'doorE2', 'doorX1', 'doorX2'].forEach(function (d) { door(d, false); });
    ['bE', 'bX', 'bA1', 'bB1', 'bA2', 'bB2'].forEach(function (b) { beam(b, false); });
    card('E', '', '', false); card('X', '', '', false); alarm(false);
    $('rdE').classList.remove('on'); $('rdX').classList.remove('on');
    refresh();
    say('Press a button', 'Tap a card at the entrance to let someone in, then send people into the lecture rooms. Use "Two people, one card" to show the alarm.');
  }
  function setSpeed(s) {
    slow = s;
    $('sp-n').setAttribute('aria-pressed', s ? 'false' : 'true');
    $('sp-s').setAttribute('aria-pressed', s ? 'true' : 'false');
    document.documentElement.style.setProperty('--mv', (MV() / 1000) + 's');
  }

  $('e-one').onclick = function () { if (!busy) { entry(false); } };
  $('e-two').onclick = function () { if (!busy) { entry(true); } };
  $('x-one').onclick = function () { if (!busy) { exit_(false); } };
  $('x-two').onclick = function () { if (!busy) { exit_(true); } };
  $('r1-in').onclick = function () { if (!busy) { roomIn(1); } };
  $('r1-out').onclick = function () { if (!busy) { roomOut(1); } };
  $('r2-in').onclick = function () { if (!busy) { roomIn(2); } };
  $('r2-out').onclick = function () { if (!busy) { roomOut(2); } };
  $('reset').onclick = reset;
  $('sp-n').onclick = function () { setSpeed(false); };
  $('sp-s').onclick = function () { setSpeed(true); };
  setSpeed(false);
  refresh();
})();
</script>

</body>
</html>
